name: release_resources

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "目标版本号（如 v1.0.1）"
        required: true
        type: string
      previous_tag:
        description: "hotfix 对比基线（可选，不填自动推断）"
        required: false
        default: ""
        type: string
      publish_release:
        description: "是否发布到 GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and refs
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          INPUT_PREVIOUS: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG_NAME="$RELEASE_TAG"
            COMPARE_REF="$TAG_NAME"
            PREVIOUS_REF="$(git tag --merged "$COMPARE_REF" --sort=-creatordate | grep -vxF "$TAG_NAME" | head -n 1 || true)"
            IS_PRERELEASE=false
            if [[ "$TAG_NAME" =~ (alpha|beta|rc|dev) ]]; then
              IS_PRERELEASE=true
            fi

            PUBLISH_RELEASE=true
          else
            TAG_NAME="$INPUT_TAG"
            PUBLISH_RELEASE="$INPUT_PUBLISH"
            PREVIOUS_REF_INPUT="$INPUT_PREVIOUS"

            if [[ -z "$TAG_NAME" ]]; then
              echo "[ERROR] tag 不能为空"
              exit 1
            fi

            if [[ "$TAG_NAME" != v* ]]; then
              TAG_NAME="v$TAG_NAME"
            fi

            COMPARE_REF="HEAD"
            PREVIOUS_REF=""
            if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
              COMPARE_REF="$TAG_NAME"
            else
              echo "[WARN] 未找到 tag $TAG_NAME，将基于当前提交构建包"
            fi

            if [[ -n "$PREVIOUS_REF_INPUT" ]]; then
              PREVIOUS_REF="$PREVIOUS_REF_INPUT"
            else
              PREVIOUS_REF="$(git tag --merged "$COMPARE_REF" --sort=-creatordate | grep -vxF "$TAG_NAME" | head -n 1 || true)"
            fi

            IS_PRERELEASE=false
            if [[ "$TAG_NAME" =~ (alpha|beta|rc|dev) ]]; then
              IS_PRERELEASE=true
            fi
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          TARGET_COMMIT="$(git rev-parse --verify "$COMPARE_REF^{commit}")"
          echo "compare_ref=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "previous_ref=$PREVIOUS_REF" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build verified resource packages
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
          COMPARE_REF: ${{ steps.vars.outputs.compare_ref }}
          PREVIOUS_REF: ${{ steps.vars.outputs.previous_ref }}
        run: python3 tools/build_release.py --version "$TAG_NAME" --target "$COMPARE_REF" --base "$PREVIOUS_REF"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mah_res-packages-${{ steps.vars.outputs.tag_name }}
          path: |
            dist/mah_res-full-*.zip
            dist/mah_res-hotfix-*.zip
            dist/mah_res-manifest.json

      - name: Publish GitHub Release
        if: ${{ steps.vars.outputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ steps.vars.outputs.compare_ref }}
          files: |
            dist/mah_res-full-*.zip
            dist/mah_res-hotfix-*.zip
            dist/mah_res-manifest.json
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          draft: false
